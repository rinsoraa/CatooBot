<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <title>CatooBot 控制台</title>
    <script>
      // Apply the stored theme before the bundle runs: no white flash (§35),
      // and no dependency on the app being mounted.
      ;(function () {
        try {
          var pref = localStorage.getItem('catoobot-theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-B8A-UG-W.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BJQKKE5n.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
