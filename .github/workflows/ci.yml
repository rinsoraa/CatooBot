name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint · format · types · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The lockfile is the single source of dependency truth: --frozen fails
      # the job instead of silently re-resolving when pyproject.toml drifts.
      - name: Install (frozen lockfile + dev extra)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff check)
        run: uv run --frozen ruff check .

      - name: Format check (ruff format --check)
        run: uv run --frozen ruff format --check .

      - name: Types (mypy app)
        run: uv run --frozen mypy app

      - name: Tests (pytest tests)
        # Failures are surfaced as workflow annotations: the job log is not
        # always reachable, the annotations API is.
        run: |
          status=0
          uv run --frozen pytest tests -q --tb=line -rf > /tmp/pytest.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -25 | while IFS= read -r line; do
              echo "::error title=pytest::${line}"
            done
            tail -20 /tmp/pytest.log | while IFS= read -r line; do
              echo "::warning::${line}"
            done
          else
            tail -3 /tmp/pytest.log
          fi
          exit "$status"


      # W6: real browser E2E against a real Bot (Chromium + the WebUI built above)
      - name: Set up Node 22 (for the browser E2E)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI deps (for the browser E2E)
        working-directory: webui
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: webui
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (login → domains → mutation → gates → logout)
        working-directory: webui
        env:
          CATOOBOT_E2E_PASSWORD: e2e-test-password
        run: npm run test:e2e

  webui:
    name: webui · typecheck · tests · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      # webui/dist is committed on purpose: the aiohttp server serves it and no
      # Node toolchain is needed at runtime. The committed bundle is built on
      # Windows; a Linux build produces different content hashes (platform
      # minifier output), so the hard checks are structural: the same module
      # graph, and every asset the committed index.html references exists.
      # A byte-level difference is surfaced as a warning, never a false failure.
      - name: Verify the committed bundle matches the build
        working-directory: .
        run: |
          strip_hash() { sed -E 's/-[A-Za-z0-9_-]{8}\././' ; }
          committed=$(git ls-files webui/dist | sed 's#webui/dist/##' | grep -v '^index.html$' | strip_hash | sort -u)
          built=$(cd webui/dist && find . -type f | sed 's#^\./##' | grep -v '^index.html$' | strip_hash | sort -u)
          if [ "$committed" != "$built" ]; then
            echo "::error title=webui dist::committed webui/dist has a different module graph than a fresh build"
            diff <(echo "$committed") <(echo "$built") || true
            exit 1
          fi
          missing=0
          # pattern without a leading slash: portable across shells (MSYS would
          # rewrite a `/assets/...` argument into a Windows path)
          for asset in $(git show HEAD:webui/dist/index.html | tr -d '\r' | grep -oE 'assets/[A-Za-z0-9_.-]+' | sort -u); do
            if ! git cat-file -e "HEAD:webui/dist/${asset}" 2>/dev/null; then
              echo "::error title=webui dist::committed index.html references a missing asset: ${asset}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          if ! git diff --quiet -- webui/dist; then
            echo "::warning title=webui dist::content hashes differ from a fresh Linux build (expected); the committed bundle is the one aiohttp serves"
          fi
          echo "committed bundle matches the build ($(echo "$built" | wc -l) assets, same module graph)"
