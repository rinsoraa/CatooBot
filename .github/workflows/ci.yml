name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint · format · types · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The lockfile is the single source of dependency truth: --frozen fails
      # the job instead of silently re-resolving when pyproject.toml drifts.
      - name: Install (frozen lockfile + dev extra)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff check)
        run: uv run --frozen ruff check .

      - name: Format check (ruff format --check)
        run: uv run --frozen ruff format --check .

      - name: Types (mypy app)
        run: uv run --frozen mypy app

      - name: Tests (pytest tests)
        run: uv run --frozen pytest tests -q
