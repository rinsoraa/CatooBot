name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint · format · types · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The lockfile is the single source of dependency truth: --frozen fails
      # the job instead of silently re-resolving when pyproject.toml drifts.
      - name: Install (frozen lockfile + dev extra)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff check)
        run: uv run --frozen ruff check .

      - name: Format check (ruff format --check)
        run: uv run --frozen ruff format --check .

      - name: Types (mypy app)
        run: uv run --frozen mypy app

      - name: Tests (pytest tests)
        # Failures are surfaced as workflow annotations: the job log is not
        # always reachable, the annotations API is.
        run: |
          status=0
          uv run --frozen pytest tests -q --tb=line -rf > /tmp/pytest.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -25 | while IFS= read -r line; do
              echo "::error title=pytest::${line}"
            done
            tail -20 /tmp/pytest.log | while IFS= read -r line; do
              echo "::warning::${line}"
            done
          else
            tail -3 /tmp/pytest.log
          fi
          exit "$status"

  webui:
    name: webui · typecheck · tests · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      # webui/dist is committed on purpose: the aiohttp server serves it and no
      # Node toolchain is needed at runtime. This proves the committed bundle is
      # the one these sources produce — file names carry the content hashes, so
      # a stale bundle fails hard; a byte-level diff (platform-specific
      # minifier output) is reported as a warning instead of a false failure.
      - name: Verify the committed bundle matches the build
        working-directory: .
        run: |
          committed=$(git ls-files webui/dist | sed 's#webui/dist/##' | sort)
          built=$(cd webui/dist && find . -type f | sed 's#^\./##' | sort)
          if [ "$committed" != "$built" ]; then
            echo "::error title=webui dist::committed webui/dist does not match a fresh build"
            diff <(echo "$committed") <(echo "$built") || true
            exit 1
          fi
          if ! git diff --quiet -- webui/dist; then
            echo "::warning title=webui dist::webui/dist differs byte-wise from a fresh build (platform minifier output); names and hashes match"
          fi
          echo "committed bundle matches the build ($(echo "$built" | wc -l) files)"
